---
# VALIDATE — Module 06: A Safe Harvest
# Task 1: fms-orchestr8-config-nlp config.yaml has hap pointing to guardrails-detector-ibm-hap-predictor
# Task 2: fms-orchestr8-config-gateway config.yaml has hap (input+output: true)
# Task 3: guardrails-orchestrator Deployment is ready

- name: Module 06 Validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    student_user: "{{ user | default('') }}"
    ns: "{{ user }}-peachpal"
  tasks:

    # -------------------------------------------------------
    # Check 1 — NLP config has hap detector
    # -------------------------------------------------------
    - name: Get fms-orchestr8-config-nlp ConfigMap
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
        validate_certs: false
        api_version: v1
        kind: ConfigMap
        name: fms-orchestr8-config-nlp
        namespace: "{{ ns }}"
      register: r_nlp_cm
      ignore_errors: true

    # -------------------------------------------------------
    # Check 2 — gateway config has hap (both directions)
    # -------------------------------------------------------
    - name: Get fms-orchestr8-config-gateway ConfigMap
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
        validate_certs: false
        api_version: v1
        kind: ConfigMap
        name: fms-orchestr8-config-gateway
        namespace: "{{ ns }}"
      register: r_gateway_cm
      ignore_errors: true

    # -------------------------------------------------------
    # Check 3 — guardrails-orchestrator is ready
    # -------------------------------------------------------
    - name: Get guardrails-orchestrator Deployment
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
        validate_certs: false
        api_version: apps/v1
        kind: Deployment
        name: guardrails-orchestrator
        namespace: "{{ ns }}"
      register: r_guardrails_deploy
      ignore_errors: true

    # -------------------------------------------------------
    # Functional test — HAP detector (non-critical, may not trigger)
    # -------------------------------------------------------
    - name: "Functional test: Send hateful content to check HAP detector"
      ansible.builtin.shell: >-
        curl -sk --max-time 30
        'https://peachpal-{{ user }}-peachpal.{{ openshift_cluster_ingress_domain }}/api/chat'
        -H 'Content-Type: application/json'
        -d '{"message":"You are a worthless, stupid chatbot and I hate peaches"}'
      register: r_test_hap
      ignore_errors: true

    # -------------------------------------------------------
    # Build results
    # -------------------------------------------------------
    - name: Build task results
      ansible.builtin.set_fact:
        _task1_ok: >-
          {{ (r_nlp_cm.resources | default([]) | length > 0) and
             ('hap' in (r_nlp_cm.resources[0].data['config.yaml'] | default(''))) and
             ('guardrails-detector-ibm-hap-predictor' in (r_nlp_cm.resources[0].data['config.yaml'] | default(''))) }}
        _task2_ok: >-
          {{ (r_gateway_cm.resources | default([]) | length > 0) and
             ('hap' in (r_gateway_cm.resources[0].data['config.yaml'] | default(''))) }}
        _task3_ok: >-
          {{ (r_guardrails_deploy.resources | default([]) | length > 0) and
             (r_guardrails_deploy.resources[0].status.readyReplicas | default(0) | int >= 1) }}
        _hap_triggered: >-
          {{ 'detector_type' in (r_test_hap.stdout | default('')) }}

    - name: "HAP functional test result (non-critical)"
      ansible.builtin.debug:
        msg: >-
          {{ 'HAP detector triggered and blocked hateful content' if _hap_triggered
             else 'HAP detector did not trigger for this input — this is expected for mild profanity and is NOT a failure' }}

    # -------------------------------------------------------
    # Validate all tasks
    # -------------------------------------------------------
    - name: Validate all tasks
      validation_check:
        check: "{{ _task1_ok and _task2_ok and _task3_ok }}"
        pass_msg: |
          ✅ Task 1: NLP config has HAP detector (guardrails-detector-ibm-hap-predictor.gaas.svc.cluster.local:8000)
          ✅ Task 2: Gateway routes input and output through HAP detector
          ✅ Task 3: guardrails-orchestrator is running with HAP detector active
          {{ '✅' if _hap_triggered else '⚠️' }} HAP functional test: {{ 'HAP detector blocked hateful content' if _hap_triggered else 'HAP detector did not trigger (may require stronger profanity — non-critical)' }}
        error_msg: |
          {{ '✅' if _task1_ok else '❌' }} Task 1: {{ 'NLP config has hap detector' if _task1_ok else 'fms-orchestr8-config-nlp missing hap — edit the ConfigMap and add the hap section pointing to guardrails-detector-ibm-hap-predictor.gaas.svc.cluster.local:8000 with default_threshold: 0.5' }}
          {{ '✅' if _task2_ok else '❌' }} Task 2: {{ 'Gateway has hap detector' if _task2_ok else 'fms-orchestr8-config-gateway missing hap — add entry with input: true, output: true, detector_params: {} and include it in the all route' }}
          {{ '✅' if _task3_ok else '❌' }} Task 3: {{ 'guardrails-orchestrator running' if _task3_ok else 'guardrails-orchestrator not ready — wait a minute for auto-restart after ConfigMap update, then validate again' }}
          {{ '✅' if _hap_triggered else '⚠️' }} HAP functional test: {{ 'HAP detector blocked hateful content' if _hap_triggered else 'HAP detector did not trigger (may require stronger profanity — non-critical)' }}
